name: Peekaboo iOS Build
# Note: If the repo has existing GitHub Actions workflows,
# those will also run independently. Only the Peekaboo
# workflow uploads to your preview.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Peekaboo build ID'
        required: true
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment variables
        run: |
          env | grep "^PEEKABOO_ENV_" | while IFS='=' read -r key value; do
            clean_key="${key#PEEKABOO_ENV_}"
            echo "$clean_key=$value" >> $GITHUB_ENV
            echo "$clean_key=$value" >> .env
            echo "$clean_key=$value" >> .env.local
            echo "$clean_key=$value" >> .env.production
            echo "$clean_key=$value" >> .env.development
          done
          echo "✓ Environment variables configured"
        working-directory: .

      - name: Build for Simulator
        working-directory: .
        run: xcodebuild -scheme "SwiftRadio" -sdk iphonesimulator -configuration Debug -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO

      - name: Zip .app artifact
        run: |
          APP=$(find ./build -name "*.app" \
            -not -name "*.appex" \
            -not -path "*/\.*" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found. Build directory contents:"
            find ./build -type d | head -20
            exit 1
          fi
          echo "Found: $APP"

          # Check app size before zipping
          APP_SIZE_MB=$(du -sm "$APP" | cut -f1)
          echo "App size: ${APP_SIZE_MB}MB"

          if [ "$APP_SIZE_MB" -gt 500 ]; then
            echo "PEEKABOO_ERROR: APP_TOO_LARGE:${APP_SIZE_MB}" | tee .peekaboo_error
            exit 2
          fi

          zip -r app.zip "$APP"
          ZIP_SIZE_MB=$(du -sm app.zip | cut -f1)
          echo "Zipped: ${ZIP_SIZE_MB}MB"

          if [ "$ZIP_SIZE_MB" -gt 50 ]; then
            echo "PEEKABOO_ERROR: ZIP_TOO_LARGE:${ZIP_SIZE_MB}" | tee .peekaboo_error
            exit 2
          fi

          echo "Size check passed"
        working-directory: .

      - name: Get signed upload URL
        run: |
          WEBHOOK_URL="${{ secrets.PEEKABOO_WEBHOOK_URL }}"
          BASE_URL=$(echo "$WEBHOOK_URL" | sed 's|/api/webhook/build||')
          UPLOAD_URL="$BASE_URL/api/upload-url"
          echo "Base URL: $BASE_URL"
          echo "Upload URL: $UPLOAD_URL"
          RESPONSE=$(curl -s -X POST "$UPLOAD_URL" \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}"}')
          echo "Response: $RESPONSE"
          SIGNED_URL=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('signedUrl',''))")
          if [ -z "$SIGNED_URL" ]; then
            echo "ERROR: Could not get signed URL"
            echo "Response was: $RESPONSE"
            exit 1
          fi
          echo "✓ Got signed URL"
          echo "SIGNED_URL=$SIGNED_URL" >> $GITHUB_ENV
        working-directory: .

      - name: Upload app.zip to Supabase Storage
        run: |
          curl -X PUT "$SIGNED_URL" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @app.zip
        working-directory: .

      - name: Notify Peekaboo webhook
        run: |
          curl -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }} \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}"}'
        working-directory: .

      - name: Notify failure
        if: failure()
        run: |
          ERROR_MSG="Build failed on GitHub Actions"
          EXIT_CODE=$?

          # Check if it was a size error
          if grep -r "PEEKABOO_ERROR: ZIP_TOO_LARGE" . 2>/dev/null || \
             grep -r "PEEKABOO_ERROR: APP_TOO_LARGE" . 2>/dev/null; then
            SIZE=$(grep -r "PEEKABOO_ERROR:.*LARGE" . 2>/dev/null | grep -o '[0-9]*$' | head -1)
            ERROR_MSG="APP_SIZE_LIMIT:${SIZE}MB"
          fi

          curl -s -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }} \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"build_id\": \"${{ github.event.inputs.build_id }}\",
              \"status\": \"failed\",
              \"error\": \"$ERROR_MSG. Full logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
        working-directory: .
